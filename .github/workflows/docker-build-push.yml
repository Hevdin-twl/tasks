name: Build and Deploy with ArgoCD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Log in to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Extract short SHA and export TAG
        run: |
          TAG=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "TAG=${TAG}" >> $GITHUB_ENV

      - name: Build and Push Docker images
        run: |
          docker buildx build -f ./python/Dockerfile ./python/ \
            --platform linux/amd64,linux/arm64 \
            -t hevdin/flask-test:${TAG} \
            -t hevdin/flask-test:latest \
            --push
      - name: Update image.tag in values.yaml
        run: |
            sed -i -E "s|(^[[:space:]]*tag:[[:space:]]*).*|\1${TAG}|" helm/flask_app/values.yaml
      - name: Commit and push updated tag
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add helm/flask_app/values.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit. Skipping."
          else
            git commit -m "Update images tag to ${TAG}"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
          fi
