name: Build and Push Docker Image

on:
  push:
    branches:
      - main  # Или ваша целевая ветка

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        id: build-image
        run: |
          TAG=$(echo "${GITHUB_SHA}" | cut -c1-7) # Получаем короткий SHA-1
          echo "TAG=${TAG}" >> $GITHUB_ENV  # Сохраняем в переменной окружения
          docker buildx build --push -t hevdin/flask-test:${TAG} ../../python/Dockerfile # Укажите правильный путь к Dockerfile и контексту
