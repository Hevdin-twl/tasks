name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
        uses: actions/checkout@v2

    - name: Log in to Docker Hub
       uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
        id: build-image
        run: |
          TAG=$(echo "${GITHUB_SHA}" | cut -c1-7) # Получаем короткий SHA-1
          echo "TAG=${TAG}" >> $GITHUB_ENV  # Сохраняем в переменной окружения
          docker build . -t myimage:${TAG}  # Собираем образ

    - name: Push Docker image
        run: |
          TAG=$(echo "${GITHUB_SHA}" | cut -c1-7)  # Получаем короткий SHA-1
          docker push myimage:${TAG}  # Загружаем образ в DockerHub
