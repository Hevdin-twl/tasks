apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-test
  labels:
    app: flask-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-test
  template:
    metadata:
      labels:
        app: flask-test
    spec:
      containers:
      - name: my-flask-container
        image: hevdin/myimages:flask_test
        ports:
        - containerPort: 8080
