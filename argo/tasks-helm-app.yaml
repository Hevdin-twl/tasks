apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tasks-helm
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: hevdin/flask-test:~>0.0.1
    argocd-image-updater.argoproj.io/hevdin.flask-test.update-strategy: newest
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-branch: main
spec:
  project: default
  source:
    helm:
      valueFiles:
      - values.yaml
    path: helm/flask_app/
    repoURL: https://github.com/Hevdin-twl/tasks.git
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true


