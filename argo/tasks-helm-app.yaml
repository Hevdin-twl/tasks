apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tasks-helm
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: docker.io/hevdin/flask-test
    argocd-image-updater.argoproj.io/docker.io.hevdin.flask-test.update-strategy: newest
    argocd-image-updater.argoproj.io/docker.io.hevdin.flask-test.force-update: "true"
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-branch: main
spec:
  project: default
  source:
    repoURL: https://github.com/Hevdin-twl/tasks.git
    targetRevision: HEAD
    path: helm/flask_app
    helm:
      parameters:
        - name: image.tag
          value: latest
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

