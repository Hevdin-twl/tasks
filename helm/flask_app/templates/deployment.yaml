apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-test1
  labels:
    app: flask-test1
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: flask-test1
  template:
    metadata:
      labels:
        app: flask-test1
    spec:
      containers:
      - name: flask-test1
        image: {{ .Values.image.repository }}:latest
        ports:
        - containerPort: 8080
