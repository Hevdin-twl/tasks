apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels:
    app: {{ .Values.name }}
    app_type: flask-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: {{ .Values.name }}
      app_type: flask-test
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
        app_type: flask-test
    spec:
      containers:
      - name: {{ .Values.name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        ports:
        - containerPort: 8080
